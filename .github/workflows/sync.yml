name: Sync Steam TOMLs

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steammonitor-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pull mmxlyo/steam-monitor
        run: |
          set -euo pipefail
          git clone --depth 1 --branch pattern --single-branch https://github.com/mmxlyo/steam-monitor.git /tmp/src-pattern
          git clone --depth 1 --branch ipc --single-branch https://github.com/mmxlyo/steam-monitor.git /tmp/src-ipc
          git clone --depth 1 --branch main --single-branch https://github.com/mmxlyo/steam-monitor.git /tmp/src-main

          mkdir -p pattern/steamclient pattern/steamui ipc/steamclient
          cp -R /tmp/src-pattern/steamclient/. pattern/steamclient/
          cp -R /tmp/src-pattern/steamui/. pattern/steamui/
          cp -R /tmp/src-ipc/steamclient/. ipc/steamclient/
          cp /tmp/src-main/README.md README.md
          rm -rf steamclient steamui

      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No TOML changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync IPC/pattern TOMLs from mmxlyo/steam-monitor"
          git push
